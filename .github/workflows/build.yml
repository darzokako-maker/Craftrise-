name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Fix flat imports & validate
        shell: python
        run: |
          import glob, json, re

          # Mappings.json dogrulama
          json.load(open("Mappings.json", encoding="utf-8"))
          print("Mappings.json OK")

          # Tek dizin yapisi icin importlari otomatik duzelt
          patterns = [
              (r"from\s+src\.(core|gui|modules|mapper)\.", "from "),
              (r"from\s+\.\.(core|gui|modules|mapper)\.", "from "),
              (r"from\s+\.([a-zA-Z_][a-zA-Z0-9_]*)\s+import", r"from \1 import"),
          ]
          for path in glob.glob("*.py"):
              with open(path, "r", encoding="utf-8") as f:
                  txt = f.read()
              new_txt = txt
              for pat, rep in patterns:
                  new_txt = re.sub(pat, rep, new_txt)
              if new_txt != txt:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(new_txt)
                  print(f"Fixed imports in {path}")

      - name: Syntax check
        run: python -m compileall -q .

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --console ^
            --name "atapiro-1337" ^
            --paths "." ^
            --add-data "Mappings.json;." ^
            --hidden-import "jvm_reader" ^
            main.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: atapiro-1337-exe
          path: dist/atapiro-1337.exe
          if-no-files-found: error
